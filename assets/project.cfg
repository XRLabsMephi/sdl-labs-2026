# Run-time settings. Paths are relative to the executable.
window_title RayCaster
window_width 1024
window_height 768
frame_width 1024
frame_height 768
window_resizable true
relative_mouse true
show_fps true

map assets/map.txt
texture_mapping assets/textures/textures_mapping.txt

# World units (one grid cell / one wall height = 1), and degrees.
field_of_view_deg 60
eye_height 0.5
player_radius 0.2
move_speed 3.0
rotation_speed 2.0
mouse_sensitivity 0.002
max_movement_step 0.1

# Perspective depth by default. true uses distance along each ray.
fish_eye false
angle_projection false
wall_color 255 175 119
ground_color 76 76 76
sky_color 147 89 124
minimal_brightness 0.6
darkening_distance 30.0
fog_color 72 76 84
fog_start 2.0
fog_end 12.0

# SDL scancode names.
forward_key W
backward_key S
left_key A
right_key D
turn_left_key Left
turn_right_key Right
exit_key Escape
